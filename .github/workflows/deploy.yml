name: Deploy to GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

env:
  # Repository variable (Settings → Secrets and variables → Actions → Variables). The build fails without it.
  PUBLIC_CONTACT_ENDPOINT: ${{ vars.PUBLIC_CONTACT_ENDPOINT }}

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - run: npm run check
      - run: npm test
      - run: npm run build
      - uses: actions/upload-pages-artifact@v5
        with:
          path: dist

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v5
      # Tells Bing (which also feeds ChatGPT search and Copilot) what changed, instead of waiting for a crawl.
      # The key is public by design: it must match public/<key>.txt. A failed ping never fails the deploy.
      - name: Submit URLs to IndexNow
        continue-on-error: true
        env:
          INDEXNOW_KEY: 5d47e7a00f7195528d1173fa51671137
        run: |
          urls=$(curl -fsS https://lukehollenback.me/sitemap-0.xml | grep -o '<loc>[^<]*' | sed 's/<loc>//' | jq -R . | jq -s .)
          jq -n --arg key "$INDEXNOW_KEY" --argjson urls "$urls" \
            '{host: "lukehollenback.me", key: $key, keyLocation: "https://lukehollenback.me/\($key).txt", urlList: $urls}' \
            | curl -fsS -X POST https://api.indexnow.org/indexnow -H 'Content-Type: application/json; charset=utf-8' -d @-
